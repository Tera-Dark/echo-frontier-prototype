name: Test, build and deploy Hunger Protocol

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Syntax and interaction tests
        run: |
          node --check game.js
          node --check src/core/storage.js
          node --check src/core/clock.js
          node --check src/core/progression.js
          node --check src/render/siege-art.js
          npm test
      - name: Build isolated web bundle
        run: npm run build
      - name: Check app/web boundaries
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),assert=require("node:assert/strict");
          const html=fs.readFileSync("dist/index.html","utf8");
          const css=fs.readFileSync("dist/style.css","utf8");
          const config=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
          assert.equal(config.webDir,"dist");
          assert.ok(html.includes('src="src/core/storage.js"')&&html.includes('src="src/core/clock.js"')&&html.includes('src="src/core/progression.js"'));
          assert.ok(html.includes('src="game.js"')&&html.includes('src="src/render/siege-art.js"')&&html.includes('href="manifest.webmanifest"'));
          assert.ok(css.includes("max-width:760px")&&css.includes("orientation:landscape"));
          assert.ok(fs.existsSync("dist/sw.js")&&fs.existsSync("dist/assets/icon.svg"));
          console.log("Web build and future app shell validated.");
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production bundle only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
