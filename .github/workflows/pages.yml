name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")
          js = Path("game.js").read_text(encoding="utf-8")
          assert 'name="viewport"' in html, "Missing responsive viewport metadata"
          assert 'href="style.css"' in html and 'src="game.js"' in html, "Missing app assets"
          assert "max-width:760px" in css and "orientation:landscape" in css, "Missing responsive layouts"
          assert 'id="command-button"' in html and "function commandHorde" in js, "Missing playable horde command controls"
          assert 'data-drawer-view="settings"' in html and 'id="setting-team-highlight"' in html, "Missing in-game display settings"
          assert "const worldScale=()=>" in js and "preferences.teamHighlight" in js, "Missing scale-aware entity rendering"
          print("Assets, responsive layouts, gameplay commands, settings, and scale-aware rendering validated.")
          PY
          node --check game.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
